name: ci
# Active in M0. No secrets, no deploy, no Cloudflare. Safe for fork pull requests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Unit and security tests
        run: node --test "test/*.test.mjs"
      - name: Forbidden-dependency scan (metered Cloudflare products)
        run: node scripts/check-forbidden.mjs .
      - name: Workflow security lint (strict, pinned SHAs from config/pinned-actions.json)
        run: node scripts/check-workflows.mjs .github/workflows proposed-workflows
