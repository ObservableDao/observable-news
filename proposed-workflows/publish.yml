name: publish
# PROPOSED, INACTIVE (Stage 3 approval). Lives outside .github/workflows.
# M0 scope: validate and acknowledge the next desk draft release. No build, no deploy.
# The dispatch is only a wake-up call: the run reads the next sequence from the
# verified publication head, never from the dispatch payload.
on:
  repository_dispatch:
    types: [content-approved]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-state
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # main only; holds CHECKPOINT_SIGNING_KEY
    permissions:
      contents: write         # this job only: attach checkpoint, publish or delete the pub-* draft
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate, acknowledge and publish the next bundle (enforcement point)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_SIGNING_KEY: ${{ secrets.CHECKPOINT_SIGNING_KEY }}
          CHECKPOINT_KEY_ID: ${{ vars.CHECKPOINT_KEY_ID }}
        run: node scripts/publish-run.mjs --store "github:${{ github.repository }}"
