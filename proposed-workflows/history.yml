name: history
# PROPOSED, INACTIVE AND DISABLED. No schedule. The batch generator
# (scripts/build-history-batch.mjs) is still a fail-closed placeholder, so the
# job is switched off with "if: false". Enable only after the generator is
# implemented and its end-to-end tests pass.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-writer
  cancel-in-progress: false

jobs:
  publish-batch:
    if: ${{ false }}   # DISABLED: generator not implemented
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build the closed batch, verify the chain, publish as an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_AGE_KEY: ${{ secrets.STATE_AGE_KEY }}
        run: node scripts/build-history-batch.mjs --store "github:${{ github.repository }}"
